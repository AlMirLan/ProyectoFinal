<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Vista de mis proyectos - Más allá de lo común">

<title>Más allá de lo común | Mis proyectos</title>
<link rel="icon" href="/images/logo.png">

<!-- Iconos Bootstrap-->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
	crossorigin="anonymous"></script>

<!-- Estilos CSS-->
<link href="/css/fragments.css" rel="stylesheet">
<link href="/css/myProject.css" rel="stylesheet">
</head>

<body>
	<main>
		<header th:replace="fragments/headerSearch::header"></header>

		<div class="container-fluid py-5 bg-body-tertiary text-center">
			<h1>Mis proyectos</h1>
			<div th:if="${#lists.isEmpty(listMyProjects)}">
				<p>No tienes proyectos creados</p>
			</div>
			<div th:if="${!#lists.isEmpty(listMyProjects)}">
				<table class="table">
					<caption>Lista de mis proyectos</caption>
					<thead>
						<tr>
							<th scope="col" tabindex="0" id="col-imagen">Imagen</th>
							<th scope="col" tabindex="0" id="col-nombre">Nombre</th>
							<th scope="col" tabindex="0" id="col-genero">Género</th>
							<th scope="col" tabindex="0" id="col-numVotos">Nº votos</th>
							<th scope="col" tabindex="0" id="col-aprobacion">Aprobación</th>
							<th scope="col" tabindex="0" id="col-eliminar">Eliminar</th>
						</tr>
					</thead>

					<tbody class="table-group-divider">
						<tr th:each="project : ${listMyProjects}">
							<th scope="row"><a
								th:href="@{'/project/' + ${project.idProject}}"> <img
									th:src="@{${project.imageProject}}"
									id="proyecto-proyectoImagen" width="70px"
									th:alt="|Imagen del proyecto ${project.nameProject}|" />
							</a></th>
							<td><a th:href="@{'/project/' + ${project.idProject}}"
								th:text="${project.nameProject}" tabindex="0"></td>
							<td><a th:href="@{'/project/' + ${project.idProject}}"
								th:text="${project.category}" tabindex="0"></td>
							<td><a th:href="@{'/project/' + ${project.idProject}}"
								th:text="${project.votesCount}" tabindex="0"></td>
							<td><a th:href="@{'/project/' + ${project.idProject}}"
								th:text="${project.approval} + '%'" tabindex="0"></a></td>
							<td><a
								th:href="@{/deleteMyProject (idProject=${project.idProject})}"
								class="bi bi-trash3 me-auto" title="Eliminar"  tabindex="0" onclick="return confirm('¿Estás seguro/a?')"></a></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>
	<a href="#top" title="flechaInicio" tabindex="0" class="scroll-to-top"> <em
		class="bi bi-arrow-up-short" title="Scroll hacia arriba"></em>
	</a>
	<footer th:replace="fragments/footer::footer"></footer>
</body>
</html>
