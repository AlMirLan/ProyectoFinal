<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>Más allá de lo común | Nuevo proyecto</title>
<link rel="icon" href="/images/logo.png">

<!-- Iconos Bootstrap-->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
	crossorigin="anonymous">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
	crossorigin="anonymous"></script>

<!-- Estilos CSS-->
<link href="/css/fragments.css" rel="stylesheet">
<link href="/css/newProject.css" rel="stylesheet"

<!-- Funciones JavaScript -->
<script src="../../js/funciones.js"></script>

</head>

<body>
	<main>
		<header th:replace="fragments/header::header"></header>

		<div class="container-fluid py-5 bg-body-tertiary text-center">

			<h1>Añadir proyecto</h1>

			<div class="py-3 d-flex justify-content-center align-items-center">

				<form method="post" th:action="@{/newProject/submit}"
					th:object="${newProject}" onsubmit="return validateFormNewProject()"
					enctype="multipart/form-data">

					<div class="mb-3">
						<label for="title" class="form-label">Título</label> <input
							type="text" class="form-control" id="title"
							placeholder="Título del proyecto" th:field="*{nameProject}"
							required>
						<div class="invalid-feedback">El título debe tener entre 3 y
							100 caracteres</div>
					</div>

					<div class="mb-3">
						<label for="description" class="form-label">Descripción</label>
						<textarea class="form-control" id="description" rows="3"
							placeholder="Descripción" th:field="*{descriptionProject}"
							required></textarea>
						<div class="invalid-feedback">La descripción debe tener
							entre 4 y 1200 caracteres.</div>
					</div>

					<div class="mb-3">
						<label for="category">Género</label> <select id="category"
							class="form-select" th:field="*{category}">
							<option
								th:each="category : ${T(com.proyecto.proyecto.model.Category).values()}"
								th:value="${category}" th:text="${category}"></option>
						</select>
					</div>

					<div class="mb-3">
						<label for="image" class="form-label">Imagen</label> <input
							class="form-control" type="file" id="image" name="file"
							accept=".png, .jpg, .jpeg" required>
						<div id="fileSizeError" class="invalid-feedback">El archivo
							debe tener un tamaño máximo de 1 MB.</div>
					</div>

					<div class="py-3">
						<div class="input-group">
							<button type="submit" id="btn-registro" class="btn">Crear proyecto</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</main>
	<a href="#top" title="flechaInicio" class="scroll-to-top"> <em
		class="bi bi-arrow-up-short" title="Scroll hacia arriba"></em>
	</a>
	<footer th:replace="fragments/footer::footer"></footer>
</body>
</html>
