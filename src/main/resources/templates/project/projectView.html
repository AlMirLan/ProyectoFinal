<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Más allá de lo común | Proyecto</title>
<link rel="icon" href="/images/logo.png">

<!-- Iconos Bootstrap-->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
	crossorigin="anonymous">

<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
	crossorigin="anonymous"></script>

<!-- Estilos CSS-->
<link href="/css/fragments.css" rel="stylesheet">
<link href="/css/projectView.css" rel="stylesheet">
</head>

<body>
	<main>
		<header th:replace="fragments/header::header"></header>

		<div class="container-fluid py-5 bg-body-tertiary">
			<div class="container text-center">
				<div class="row ">
					<div class="col-4 col-lg-3 align-self-center">
						<a href="#" data-bs-toggle="modal" data-bs-target="#imageModal">
							<img th:src="@{${project.imageProject}}" class="img-fluid"
							alt="Imagen del proyecto">
						</a>
					</div>

					<!-- Modal -->
					<div class="modal fade" id="imageModal" tabindex="-1"
						aria-labelledby="imageModalLabel" aria-hidden="true">
						<div class="modal-dialog modal-dialog-centered modal-lg">
							<div class="modal-content">
								<div class="modal-header border-0">
									<button type="button" class="btn-close" data-bs-dismiss="modal"
										aria-label="Close"></button>
								</div>
								<div class="modal-body">
									<img th:src="@{${project.imageProject}}" class="img-fluid"
										alt="Imagen del juego">
								</div>
							</div>
						</div>
					</div>

					<div class="project col-7 col-lg-8">
						<h2 th:text="${project.nameProject} + '(Proyecto)'"></h2>
						<h4 class="mt-4" th:text="'Género: ' + ${project.category}"></h4>
						<p class="mt-4" th:text="${project.descriptionProject}"></p>
					</div>
				</div>

				<div class="dices">
					<img src="/images/divider.png" alt="Divisor">
				</div>

				<div class="row justify-content-center">
					<div class="col-6 col-lg-8">
						<div class="vote container">
							<h2>¡Vota!</h2>

							<form th:action="@{/voteProject}" method="post">
								<input type="hidden" name="vote" value="true" /> <input
									type="hidden" name="idProject" th:value="${project.idProject}" />
								<button type="submit" class="border-0 bg-transparent">
									<img src="/images/like.png" alt="Like" id="like" />
								</button>
							</form>

							<form th:action="@{/voteProject}" method="post">
								<input type="hidden" name="vote" value="false" /> <input
									type="hidden" name="idProject" th:value="${project.idProject}" />
								<button type="submit" class="border-0 bg-transparent">
									<img src="/images/dislike.png" alt="Dislike" id="dislike" />
								</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
	<footer th:replace="fragments/footer::footer"></footer>

</body>

</html>
