<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Vista de lista de usuarios - Más allá de lo común">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Más allá de lo común | Lista usuarios</title>
  <link rel="icon" href="/images/logo.png">

  <!-- Iconos Bootstrap-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
    crossorigin="anonymous"></script>

  <!-- Estilos CSS-->
  <link href="/css/fragments.css" rel="stylesheet">
  <link href="/css/usersList.css" rel="stylesheet">
</head>

<body>
  <main>
    <header th:replace="fragments/headerSearch::header"></header>

    <div class="container-fluid py-5 bg-body-tertiary text-center">
      <h1 id="titulo-lista" tabindex="0" >Listado de usuarios</h1>

      <table class="table" aria-labelledby="titulo-lista">
        <caption>Lista de usuarios</caption>
        <thead>
          <tr>
            <th scope="col" tabindex="0" id="col-id">ID</th>
            <th scope="col" tabindex="0" id="col-nombre">Nombre</th>
            <th scope="col" tabindex="0" id="col-correo">Correo</th>
            <th scope="col" tabindex="0" id="col-eliminar">Eliminar</th>
            <th scope="col" tabindex="0" id="col-suspender">Suspender</th>
            <th scope="col" tabindex="0" id="col-fin">Fin bloqueo</th>
          </tr>
        </thead>
        <tbody class="table-group-divider">
          <tr th:each="user : ${listOfUsers}">
            <th scope="row" tabindex="0" th:text="${user.idUser}" headers="col-id"></th>
            <td th:text="${user.nameUser}" headers="col-nombre" tabindex="0" ></td>
            <td th:text="${user.email}" headers="col-correo" tabindex="0" ></td>
            <td headers="col-eliminar" tabindex="0" >
              <a th:href="@{/deleteUser (idUser=${user.idUser})}" class="bi bi-trash3 me-auto" 
                 aria-label="Eliminar usuario" title="Eliminar" th:if="${user.email != 'admin@admin.ad'}" 
                 onclick="return confirm('¿Estás seguro/a?')" tabindex="0"></a>
            </td>
            <td headers="col-suspender">
              <div class="d-flex justify-content-center align-items-center">
                <form th:action="@{/addDaysToBannedTime}" method="post" th:if="${user.email != 'admin@admin.ad'}">
                  <input type="hidden" name="idUser" th:value="${user.idUser}" />
                  <div class="input-group me-2">
                    <label for="dias-suspension" class="visually-hidden">Días de suspensión</label>
                    <select class="form-select" name="daysToAdd" id="dias-suspension" tabindex="0">
                      <option value="1">1 día</option>
                      <option value="3">3 días</option>
                      <option value="7">7 días</option>
                      <option value="99">99 días</option>
                    </select>
                    <button class="bi bi-person-fill-slash" aria-label="Bloquear usuario" 
                            title="Bloquear" type="submit" tabindex="0"></button>
                  </div>
                </form>
              </div>
            </td>
            <td th:text="${#temporals.format(user.bannedTime, 'dd-MM-yyyy HH:mm')}" headers="col-fin" tabindex="0" ></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
  <a href="#top" title="flechaInicio" class="scroll-to-top" tabindex="0" aria-label="Volver arriba"> 
    <em class="bi bi-arrow-up-short" title="Scroll hacia arriba"></em>
  </a>
  <footer th:replace="fragments/footer::footer"></footer>
</body>
</html>
