<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Más allá de lo común | Perfil</title>
<link rel="icon" href="/images/logo.png">

<!-- Iconos Bootstrap-->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
	crossorigin="anonymous">

<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
	crossorigin="anonymous"></script>

<!-- Estilos CSS-->
<link href="/css/fragments.css" rel="stylesheet">
<link href="/css/profile.css" rel="stylesheet">

<!-- Funciones JavaScript -->
<script src="../../js/funciones.js"></script>

</head>

<body>
	<main>

		<header th:replace="fragments/header::header"></header>

		<div class="container-fluid py-5 bg-body-tertiary">
			<h1>Modificar usuario</h1>

			<div class="py-3 d-flex justify-content-center align-items-center">

				<!-- Formulario para usuarios -->
				<form class="needs-validation" method="post"
					th:action="@{/user/updateUser}" onsubmit="return validateUser()"
					th:object="${modifiedUser}" novalidate
					enctype="multipart/form-data"
					sec:authorize="!hasRole('ROLE_ADMIN')">

					<div th:if="${errorName}" class="error-message">
						<p th:text="${errorName}"></p>
					</div>

					<div th:if="${errorEmail}" class="error-message">
						<p th:text="${errorEmail}"></p>
					</div>

					<div class="mb-3">
						<label for="name"
							th:text="'Nombre de usuario original - ' + ${session.userSession.nameUser}"
							class="form-label"></label>
						<div class="input-group">
							<span class="input-group-text bi bi-person-fill" title="usuario"
								id="basic-addon3"></span> <input type="text" id="name"
								class="form-control rounded-end"
								placeholder="Nombre (4-20 caracteres)" th:field="*{nameUser}"
								pattern="[a-zA-Z0-9._-]{4,20}$" autofocus required></input>
							<div class="invalid-feedback">Por favor, elije un nombre de
								usuario válido</div>
						</div>
					</div>

					<div class="mb-3">
						<label for="email"
							th:text="'Email original - ' + ${session.userSession.email}"
							class="form-label"></label>
						<div class="input-group">
							<span class="input-group-text bi bi-envelope-at-fill"
								title="email" id="basic-addon3"></span> <input type="text"
								class="form-control rounded-end" id="email"
								placeholder="Correo electrónico" th:field="*{email}"
								pattern="[a-z0-9._%+-]+@[a-z0-9]+\.[a-z]{2,4}$" required></input>
							<div class="invalid-feedback">Por favor, escribe un correo
								válido</div>
						</div>
					</div>

					<div class="mb-3">
						<div class="input-group">
							<span class="input-group-text bi bi-lock-fill" id="basic-addon3"
								title="contraseña"></span> <input type="password"
								class="form-control rounded-end" id="pass" th:field="*{pass}"
								placeholder="Contraseña (6-10 caracteres)" pattern=".{6,10}"
								required />
							<div class="invalid-feedback">Por favor, escribe una
								contraseña válida</div>
						</div>
					</div>

					<div class="mb-3">
						<div class="input-group">
							<span class="input-group-text bi bi-lock-fill" id="basic-addon3"
								title="repite contraseña"></span> <input type="password"
								class="form-control rounded-end" id="repit-pass"
								placeholder="Repita la contraseña" pattern=".{6,10}" required />
							<div class="invalid-feedback">La contraseña no coincide o
								está vacía</div>
						</div>
					</div>

					<div class="py-3">
						<div class="input-group">
							<button type="submit" id="btn-registro" class="btn btn">Modificar</button>
						</div>
					</div>
				</form>

				<!-- Formulario para el administrador -->
				<form class="needs-validation" method="post"
					th:action="@{/user/updateUserPassword}" th:object="${modifiedUser}"
					enctype="multipart/form-data" novalidate
					sec:authorize="hasRole('ROLE_ADMIN')"
					onsubmit="return validateAdmin()">

					<div class="mb-3">
						<div class="input-group">
							<span class="input-group-text bi bi-lock-fill" id="basic-addon3"
								title="contraseña"></span> <input type="password"
								class="form-control rounded-end" id="admin-pass" name="password"
								placeholder="Contraseña (6-10 caracteres)" pattern=".{6,10}"
								required />
							<div class="invalid-feedback">Por favor, escribe una
								contraseña válida</div>
						</div>
					</div>

					<div class="mb-3">
						<div class="input-group">
							<span class="input-group-text bi bi-lock-fill" id="basic-addon3"
								title="repite contraseña"></span> <input type="password"
								class="form-control rounded-end" id="repit-admin-pass"
								name="confirmPassword" placeholder="Repita la contraseña"
								pattern=".{6,10}" required />
							<div class="invalid-feedback">La contraseña no coincide o
								está vacía</div>
						</div>
					</div>

					<div class="py-3">
						<div class="input-group">
							<button type="submit" id="btn-registro" class="btn btn">Modificar</button>
						</div>
					</div>
				</form>

			</div>
		</div>
	</main>
	<footer th:replace="fragments/footer::footer"></footer>

	<script>
		document.addEventListener('DOMContentLoaded', validarFormulario);
	</script>
</body>
</html>
