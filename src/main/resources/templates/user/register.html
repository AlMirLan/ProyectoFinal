<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Vista de registro - Más allá de lo común">

<title>Más allá de lo común | Formulario de registro</title>
<link rel="icon" href="/images/logo.png">

<!-- Iconos Bootstrap-->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
	crossorigin="anonymous">

<!-- Estilos CSS-->
<link href="/css/register.css" rel="stylesheet">
</head>

<body>
	<div class="container">
		<div class="py-3 d-flex justify-content-center align-items-center">
			<div class="row">
				<img src="/images/logo.png" alt="logo" id="logo" />
			</div>
		</div>

		<div class="py-1 d-flex justify-content-center align-items-center">
			<div class="row">
				<h1>Registro de usuario</h1>

				<form id="register-form" class="needs-validation mt-2" method="POST"
					action="#" th:action="@{/register/submit}" th:object="${newUser}"
					role="form" novalidate onsubmit="return validate()">

					<div id="error-nombre" th:if="${errorName}" class="error-message">
						<p th:text="${errorName}"></p>
					</div>

					<div id="error-correo" th:if="${errorEmail}" class="error-message">
						<p th:text="${errorEmail}"></p>
					</div>

					<div id="error-pass" th:if="${errorPass}" class="error-message">
						<p th:text="${errorPass}"></p>
					</div>

					<div class="input-group">
						<span class="input-group-text bi bi-person-fill" title="usuario"> 
						</span> <input type="text" id="name" class="form-control rounded-end"
							placeholder="Nombre (4-20 caracteres)" th:field="*{nameUser}"
							pattern="[a-zA-Z0-9._-]{4,20}$" autofocus required></input>
						<div class="invalid-feedback">Por favor, elije un nombre de
							usuario válido</div>
					</div>

					<div class="input-group">
						<span class="input-group-text bi bi-envelope-at-fill" title="email">
						</span> <input type="email" id="email" class="form-control rounded-end"
							placeholder="Correo electrónico" th:field="*{email}"
							pattern="[a-z0-9._%+-]+@[a-z0-9]+\.[a-z]{2,4}$" required></input>
						<div class="invalid-feedback">Por favor, escribe un correo
							válido</div>
					</div>

					<div class="input-group">
						<span class="input-group-text bi bi-lock-fill" title="contraseña"> 
						</span> <input type="password" id="pass" class="form-control rounded-end"
							placeholder="Contraseña (6-10 caracteres)" th:field="*{pass}"
							required pattern=".{6,10}"></input>
						<div class="invalid-feedback">Por favor, escribe una
							contraseña válida</div>
					</div>

					<div class="input-group">
						<span class="input-group-text bi bi-lock-fill" title="repite contraseña">
						</span> <input type="password" id="repit-pass" class="form-control rounded-end"
							placeholder="Repita la contraseña" pattern=".{6,10}" required></input>
						<div class="invalid-feedback">La contraseña no coincide o está vacía</div>
					</div>

					<div class="form-group">
						<div class="input-group">
							<button type="submit" id="btn-registro" class="btn">Crear
								una cuenta</button>
						</div>
					</div>

				</form>
			</div>
		</div>
		<a href="/login" id="login">Volver a Inicio de sesión </a>

	</div>
	<script>
		// Función anónima que se ejecuta inmediatamente
		(function() {

			// Obtiene el formulario al que se quiere aplicar estilos de validación de Bootstrap personalizados
			const form = document.querySelector('.needs-validation')

			// Evita el envío del formulario
			form.addEventListener('submit', function(event) {
				// Si el formulario no es válido, se previene el envío y se detiene la propagación del evento
				if (!form.checkValidity()) {
					event.preventDefault()
					event.stopPropagation()

					// Si el formulario es válido, pero no pasa la validación personalizada, se previene el envío
				} else if (!validate()) {
					event.preventDefault();
				}
				// Agrega la clase was-validated al formulario para mostrar los estilos de validación personalizados de Bootstrap
				form.classList.add('was-validated')
			}, false)
		})();

		// Función que valida si la contraseña ingresada coincide con la repetición de la contraseña
		function validate() {
			const pass = document.getElementById("pass").value;
			const repitPass = document.getElementById("repit-pass").value;
			// Si las contraseñas no coinciden, se establece un mensaje personalizado de validación
			if (pass != repitPass) {
				document.getElementById("repit-pass").setCustomValidity(
						"La contraseña no coincide o está vacía");
				return false;
			} else {
				// Si las contraseñas coinciden, se limpia el mensaje de validación personalizado
				document.getElementById("repit-pass").setCustomValidity("");
			}
			return true;
		}
	</script>
</body>
</html>
