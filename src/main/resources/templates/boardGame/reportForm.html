<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Vista de formulario de reporte - Más allá de lo común">
<title>Más allá de lo común | Formulario denuncia</title>
<link rel="icon" href="/images/logo.png">

<!-- Iconos Bootstrap-->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
	crossorigin="anonymous">

<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
	crossorigin="anonymous"></script>

<!-- Estilos CSS-->
<link href="/css/fragments.css" rel="stylesheet">
<link href="/css/updateGame.css" rel="stylesheet">

<!-- Funciones JavaScript -->
<script src="../../js/funciones.js"></script>

</head>

<body>
	<main>
		<header th:replace="fragments/header::header"></header>

		<div class="container-fluid py-5 bg-body-tertiary text-center">

			<h1>Formulario de denuncia</h1>

			<div class="py-3 d-flex justify-content-center align-items-center">

				<form method="post" th:action="@{/report(idGame=${idGame})}" th:object="${report}" onsubmit="return validateFormReport()">

					<div class="mb-3">
						<label for="comment" class="form-label">Descripción del problema</label>
						<textarea class="form-control" name="comment" id="comment" rows="3"
							placeholder="Descripción" th:field="*{comment}" required></textarea>
						<div class="invalid-feedback">La descripción debe tener
							entre 20 y 100 caracteres.</div>
					</div>
					<input type="hidden" th:name="idGame" th:value="${idGame}" />
					
					<div class="py-3">
						<div class="input-group">
							<button type="submit" class="btn">Enviar denuncia</button>
						</div>
					</div>
					
				</form>
			</div>
		</div>
	</main>
	<a href="#top" title="flechaInicio" tabindex="0" class="scroll-to-top"> <em
		class="bi bi-arrow-up-short" title="Scroll hacia arriba"></em>
	</a>
	<footer th:replace="fragments/footer::footer"></footer>
</body>
</html>
