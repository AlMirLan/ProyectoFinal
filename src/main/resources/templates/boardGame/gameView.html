<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Vista de un juego concreto - Más allá de lo común">
<title th:text="'Más allá de lo común | ' + ${game.nameGame}"></title>
<link rel="icon" href="/images/logo.png">

<!-- Iconos Bootstrap-->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
	crossorigin="anonymous">

<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
	crossorigin="anonymous"></script>

<!-- Estilos CSS-->
<link href="/css/fragments.css" rel="stylesheet">
<link href="/css/gameView.css" rel="stylesheet">
</head>

<body>
	<main>
		<header th:replace="fragments/header::header"></header>

		<div class="album py-5 bg-body-tertiary">
			<div class="container text-center">
				<div class="row ">
					<div class="col-3 col-lg-3 align-self-center">
						<a href="#" data-bs-toggle="modal" data-bs-target="#imageModal">
							<img th:src="@{${game.imageGame}}" class="img-fluid"
							th:alt="|Imagen del proyecto ${game.nameGame}|">
						</a>
					</div>

					<!-- Modal -->
					<div class="modal fade" id="imageModal" tabindex="-1"
						aria-labelledby="imageModalLabel" aria-hidden="true">
						<div class="modal-dialog modal-dialog-centered modal-lg">
							<div class="modal-content">
								<div class="modal-header border-0">
									<button type="button" class="btn-close" data-bs-dismiss="modal"
										aria-label="Close"></button>
								</div>
								<div class="modal-body">
									<img th:src="@{${game.imageGame}}" class="img-fluid"
										alt="Imagen del juego">
								</div>
							</div>
						</div>
					</div>

					<div class="game col-sm-6 col-lg-8">
						<h2 th:text="${game.nameGame}" tabindex="0"></h2>
						<h4 class="mt-4" th:text="'Género: ' + ${game.category}" tabindex="0"></h4>
						<p class="mt-4" th:text="${game.descriptionGame}" tabindex="0"></p>

						<!-- Botón de descarga del PDF, solo si hay archivo -->
						<div class="mt-3" th:if="${game.pdfGame != null}">
							<a 
							  th:href="@{${game.getPdfGame}}"
							  class="btn btn-outline-secondary"
							  target="_blank"
							  download
							>
							  <i class="bi bi-file-earmark-pdf"></i> Descargar PDF adjunto
							</a>
						  </div>
					</div>

					<div class="reviews col-3 col-lg-1 align-self-center">
						<p>
							<span th:text="${game.averageRating}" tabindex="0"></span> <img
								src="/images/diceAverage.png" alt="Dado de 10 caras" />
						</p>
						<p th:text="'de ' + ${game.reviewCount} + ' valoraciones'" tabindex="0"></p>
					</div>
				</div>

				<div class="dices">
					<img src="/images/divider.png" alt="Divisor">
				</div>

				<div class="row justify-content-center">
					<div class="col-sm-6 col-lg-8">
						<div class="container">
							<h2 tabindex="0">¡Deja tu reseña!</h2>

							<form method="post" th:action="@{/value(idGame=${idGame})}"
								th:object="${review}">
								<div class="form-group">
									<label for="game-rating" tabindex="0">Valoración:</label>
									<div class="rating">
										<select class="form-select form-select-sm" id="game-rating"
											name="rating" tabindex="0">
											<option value="1">1</option>
											<option value="2">2</option>
											<option value="3">3</option>
											<option value="4">4</option>
											<option value="5">5</option>
											<option value="6">6</option>
											<option value="7">7</option>
											<option value="8">8</option>
											<option value="9">9</option>
											<option value="10">10</option>
										</select>
									</div>
								</div>

								<div class="form-group">
									<label for="game-comment">Comentario:</label>
									<div class="rating">
										<textarea th:field="*{comment}" class="form-control"
											id="game-comment" maxlength="255"></textarea>
									</div>
								</div>

								<button type="submit" class="btn">Valorar</button>
							</form>
						</div>
					</div>
				</div>

				<div th:if="${#lists.isEmpty(listReview)}" id="valoracionesVacias">
					<p>Este juego aún no tiene reseñas, ¡sé el primero!</p>
				</div>

				<div class="row justify-content-center">
					<div class="col-sm-6 col-lg-8">
						<table class="table table-bordered border-secondary table-striped">
							<caption>Tabla de comentarios</caption>
							<tbody>

								<tr th:each="review : ${listReview}">
									<td><span th:text="${review.user.nameUser}" tabindex="0"></span>
										<p th:text="${review.comment}" tabindex="0"></p></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
				<div class="row justify-content-center">
					<div class="col-sm-6 col-lg-8">

						<p>¡Si detectas un problema en este juego, pulsa el botón e
							informanos!</p>
						<a th:href="@{/game/{idGame}/report(idGame=${game.idGame})}">
							<button class="btn">Denunciar</button>
						</a>
					</div>
				</div>
			</div>
		</div>

	</main>
	<a href="#top" title="flechaInicio" tabindex="0" class="scroll-to-top"> <em
		class="bi bi-arrow-up-short" title="Scroll hacia arriba"></em>
	</a>
	
	<footer th:replace="fragments/footer::footer"></footer>
</body>

</html>
