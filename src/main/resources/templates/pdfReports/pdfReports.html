<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Vista de reportes en PDF - Más allá de lo común">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Más allá de lo común | Reportes en PDF</title>
  <link rel="icon" href="/images/logo.png">

  <!-- Iconos Bootstrap-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
    crossorigin="anonymous"></script>

  <!-- Estilos CSS-->
  <link href="/css/fragments.css" rel="stylesheet">
  <link href="/css/usersList.css" rel="stylesheet">
</head>

<body>
  <main>
    <header th:replace="fragments/headerSearch::header"></header>

    <div class="container-fluid py-5 bg-body-tertiary text-center">
      <h2 tabindex="0">Elige el reporte a descargar</h2>

							<form method="post"
								>
								<div class="form-group">
									<label for="game-rating" tabindex="0">Reporte:</label>
									<div class="rating">
										<select class="form-select form-select-sm" id="selected-report"
											name="report" tabindex="0">
											<option value="1">1</option>
											<option value="2">2</option>
											<option value="3">3</option>
											<option value="4">4</option>
											<option value="5">5</option>
											<option value="6">6</option>
											<option value="7">7</option>
											<option value="8">8</option>
											<option value="9">9</option>
											<option value="10">10</option>
										</select>
									</div>
								</div>
								<button type="submit" class="btn">Descargar</button>
							</form>
    </div>
  </main>
  <a href="#top" title="flechaInicio" class="scroll-to-top" tabindex="0" aria-label="Volver arriba"> 
    <em class="bi bi-arrow-up-short" title="Scroll hacia arriba"></em>
  </a>
  <footer th:replace="fragments/footer::footer"></footer>
</body>
</html>
